name: NorthOne
description: NorthOne was a mobile-first, API-enabled business banking platform for small
  businesses, freelancers, and startups, founded in 2016 by Eytan Bensoussan and Justin
  Adler with banking services provided by The Bancorp Bank, N.A. It offered the Connected
  Bank Account (a digital business checking account) with envelope budgeting, savings
  goals, bookkeeping and accounting integrations, cash deposits, and small-business lending,
  serving 320,000+ businesses and backed by Battery Ventures, Redpoint Ventures, and
  Tencent. As of 2026 the northone.com domain redirects to Relay (relayfi.com); NorthOne
  publishes no public developer API, developer portal, documentation, or OpenAPI.
